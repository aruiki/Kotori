name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: just ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # テストのハングを数時間放置しない。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # third_party/llama.cpp(kotori-lm がビルドする、6.4)
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - run: just ci

  msrv:
    name: MSRV (1.80)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # third_party/llama.cpp(kotori-lm がビルドする、6.4)
          submodules: true
      - uses: dtolnay/rust-toolchain@1.80
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  windows-tip:
    # TSF TIP(C++20)。x64 と x86 の両方を作り、登録と解除を確かめる(REQ-10-1、docs/adr/0009)。
    name: TSF TIP (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        arch: [x64, Win32]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S frontends/windows -B build -A ${{ matrix.arch }}
      - run: cmake --build build --config Release
      - run: ./frontends/windows/tests/register.ps1 -Dll build/Release/kotori_tip.dll -Arch ${{ matrix.arch }}
        shell: pwsh
