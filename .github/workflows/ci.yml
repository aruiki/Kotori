name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: just ci (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # テストのハングを数時間放置しない。
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # third_party/llama.cpp(kotori-lm がビルドする、6.4)
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@just
      - run: just ci

  msrv:
    name: MSRV (1.80)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # third_party/llama.cpp(kotori-lm がビルドする、6.4)
          submodules: true
      - uses: dtolnay/rust-toolchain@1.80
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  windows-tip:
    # TSF TIP(C++20)。x64 と x86 の両方を作り、単体テストと登録・解除を確かめる(REQ-10-1、docs/adr/0009)。
    name: TSF TIP (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
          - arch: Win32
            target: i686-pc-windows-msvc
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # DLL の静的な VC ランタイム(/MT)に合わせる。
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v4
        with:
          # インストールの確認で作るサーバーが kotori-lm(third_party/llama.cpp)を使う
          submodules: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: tip-${{ matrix.target }}
      - run: cargo build -p kotori-client --release --locked --target ${{ matrix.target }}
      - run: cmake -S frontends/windows -B build -A ${{ matrix.arch }} "-DKOTORI_CLIENT_LIB=${{ github.workspace }}/target/${{ matrix.target }}/release/kotori_client.lib"
      - run: cmake --build build --config Release
      - run: ./build/Release/kotori_tip_tests.exe
      - run: ./frontends/windows/tests/register.ps1 -Dll build/Release/kotori_tip.dll -Arch ${{ matrix.arch }}
        shell: pwsh
      # インストールとアンインストールのスクリプト(16.2)。x64 だけで確かめる。
      - if: matrix.arch == 'x64'
        run: cargo build -p kotori-server --release --locked --target ${{ matrix.target }}
      - if: matrix.arch == 'x64'
        run: ./frontends/windows/tests/install.ps1 -Server target/${{ matrix.target }}/release/kotori-server.exe -Dll build/Release/kotori_tip.dll
        shell: pwsh
