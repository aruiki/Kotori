# Windows 版のリリース(docs/SPEC.md 16.2 の「未署名バイナリ」)。
# 以前の Rust 版の配布。Actions の画面から手で実行したときだけ動く(タグでは動かさない。いまの配布は
# Mozc ベースの MSI で、mozc-windows.yml が作る。docs/adr/0012)。手で実行するときに
# バージョンを省くと、ワークスペースの版(0.x.y-beta)の beta の番号を既にあるタグの次にする。
# サーバー・x64 と x86 の TIP・辞書・ライセンスを zip にまとめ、最新のリリース(Latest)として
# 公開する。リリースの名前は日本時間の日時と版(例 2026.929.151234 (v0.1.0-beta.2))にする。
# 配布物に関わるファイルを変える PR では、zip を作って Actions の成果物に置くだけにする(公開しない)。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: バージョン(例 0.1.0-beta.2。先頭の v は付けない。空なら beta の番号を1つ進める)
        required: false
  pull_request:
    paths:
      - .github/workflows/release.yml
      - about.hbs
      - about.toml
      - frontends/windows/*.cmd
      - frontends/windows/*.ps1
      - frontends/windows/notices.sh
      - frontends/windows/README.release.txt
      - frontends/windows/release-notes.md

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows の zip
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # third_party/llama.cpp(サーバーが静的リンクする)
          submodules: true
      - name: 版とリリースの名前を決める(SPEC 16.3)
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PR_NUMBER: ${{ github.event.number }}
        run: |
          # 次の beta の番号(PR でもここまで動かして確かめる)。
          $base = (Select-String -Path Cargo.toml -Pattern '^version = "(\d+\.\d+\.\d+)-beta' |
            Select-Object -First 1).Matches[0].Groups[1].Value
          if (-not $base) { throw 'Cargo.toml に 0.x.y-beta の版がない' }
          $pattern = "refs/tags/v$([regex]::Escape($base))-beta\.(\d+)$"
          $last = git ls-remote --tags origin "refs/tags/v$base-beta.*" |
            ForEach-Object { if ($_ -match $pattern) { [int]$Matches[1] } } |
            Measure-Object -Maximum
          $next = "$base-beta.$([int]$last.Maximum + 1)"
          Write-Host "次の beta: v$next"
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request') {
            $v = "0.0.0-pr$env:PR_NUMBER"
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $v = $env:GITHUB_REF_NAME.TrimStart('v')
          } elseif ($env:INPUT_VERSION) {
            $v = $env:INPUT_VERSION.Trim().TrimStart('v')
          } else {
            $v = $next
          }
          $now = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'Tokyo Standard Time')
          $stamp = $now.ToString('yyyy.Mdd.HHmmss', [Globalization.CultureInfo]::InvariantCulture)
          Write-Host "版 v$v、名前 $stamp (v$v)"
          "VERSION=$v" >> $env:GITHUB_ENV
          "TAG=v$v" >> $env:GITHUB_ENV
          "RELEASE_NAME=$stamp (v$v)" >> $env:GITHUB_ENV
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,i686-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: 辞書を作る
        shell: bash
        run: |
          bash data/dict-src/fetch.sh
          cargo run --release --locked -p kotori-dictc -- data/dict-src/mozc target/kotori/system.dict
      - name: サーバーと TIP を作る
        shell: pwsh
        run: ./frontends/windows/build.ps1 -OutDir dist
      - name: ライセンスの一覧を作る(REQ-16-1)
        shell: bash
        run: bash frontends/windows/notices.sh dist/THIRD_PARTY_NOTICES.txt
      - name: zip にまとめる
        shell: pwsh
        run: |
          $v = $env:VERSION
          Copy-Item frontends/windows/install.ps1, frontends/windows/uninstall.ps1 dist
          Copy-Item frontends/windows/install.cmd, frontends/windows/uninstall.cmd dist
          Copy-Item frontends/windows/README.release.txt dist/README.txt
          Copy-Item LICENSE-APACHE, LICENSE-MIT dist
          # 配置と登録・解除ができることを、zip に入れるのと同じファイルで確かめる。
          $smoke = Join-Path $env:RUNNER_TEMP 'kotori-smoke'
          ./dist/install.ps1 -Destination $smoke
          ./dist/uninstall.ps1 -Destination $smoke
          if ($LASTEXITCODE -ne 0) { throw 'uninstall.ps1 が失敗した' }
          $zip = "Kotori-$v-windows.zip"
          Compress-Archive -Path dist/* -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ascii "$zip.sha256" "$hash  $zip"
          "ZIP=$zip" >> $env:GITHUB_ENV
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP }}
          path: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
      - if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: false
          make_latest: true
          body_path: frontends/windows/release-notes.md
          files: |
            ${{ env.ZIP }}
            ${{ env.ZIP }}.sha256
