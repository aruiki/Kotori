# Mozc ベースの Windows 版を作る(docs/adr/0012 の段階 1)。
# google/mozc をコミットで固定して取得し、mozc/patches/ のパッチを当てて Kotori64.msi を作る。
# 手順は Mozc の公式 CI(.github/workflows/windows.yaml)と docs/build_mozc_in_windows.md に合わせる。
# 手で実行すると、できた MSI をリリースとして公開する。段階(channel)は beta・rc・stable から選ぶ
# (docs/adr/0037、作業カード 40)。版は mozc/tools/release_tag.py が mozc/VERSION と既にあるタグから決め、
# 名前は日本時間の日時と版にする。rc はプレリリース、beta と stable は Latest。
name: Mozc (Windows)

on:
  workflow_dispatch:
    inputs:
      channel:
        description: 'リリースの段階(beta / rc / stable)'
        type: choice
        options: [beta, rc, stable]
        default: beta
  pull_request:
    paths:
      - .github/workflows/mozc-windows.yml
      - mozc/**
      - '!mozc/README.md'
      - '!mozc/release-notes.md'
      - '!mozc/VERSION'
      # 評価と計測の道具は MSI の中身に関係しない(MSI のビルドは 45 分以上かかるので、道具だけの PR では回さない)。
      - '!mozc/tools/**'
      - '!mozc/eval_*.py'
      - '!mozc/patches/README.md'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  # data/dict-src/fetch.sh の辞書と同じコミット。
  MOZC_COMMIT: a069a88d4cb5c011de0f9aebb6c149a1c808d904

jobs:
  build:
    name: Kotori64.msi (x64)
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      # Windows のランナーは既定で改行を CRLF にするので、パッチが当たらなくなる。LF のまま取得する。
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          path: kotori
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: google/mozc
          ref: ${{ env.MOZC_COMMIT }}
          path: mozc-src
          submodules: false
          persist-credentials: false
      # 版はビルドの前に決める(同じ版の正式版が既にあるときなどを、45 分のビルドの前に落とす)。
      - name: 版を決める
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        working-directory: kotori
        env:
          CHANNEL: ${{ inputs.channel }}
        run: |
          $out = python mozc/tools/release_tag.py --channel $env:CHANNEL --repo "https://github.com/$env:GITHUB_REPOSITORY"
          if ($LASTEXITCODE -ne 0) { throw "版を決められない(上のメッセージ)" }
          $out | ForEach-Object { Write-Host $_; $_ >> $env:GITHUB_ENV }
      - name: パッチを当てる
        shell: pwsh
        run: |
          $patches = Get-ChildItem kotori/mozc/patches/*.patch -ErrorAction SilentlyContinue | Sort-Object Name
          foreach ($p in $patches) {
            Write-Host "当てる: $($p.Name)"
            git -C mozc-src apply --whitespace=nowarn $p.FullName
            if ($LASTEXITCODE -ne 0) { throw "$($p.Name) を当てられない" }
          }
      # Windows Installer は版の先頭3つで上書きの入れ替えを決めるので、Mozc の BUILD に実行番号を足して
      # リリースごとに版を上げる(docs/tasks/22、35)。版が同じだと上書きで古いファイルが残る。
      # Mozc の build_tools/mozc_version.py は「名前 = 値」の最初の語しか読まないので、足し算ではなく
      # 数値で書く(「BUILD_OSS + 21」は 6239 のままになっていた)。書いた後、実際の版を読んで確かめる。
      - name: 版を上げる
        shell: pwsh
        run: |
          $f = 'mozc-src/src/version.bzl'
          $s = Get-Content $f -Raw
          if ($s -notmatch '(?m)^BUILD_OSS = (\d+)\s*$') { throw "$f に BUILD_OSS = <数> がない" }
          $build = [int]$Matches[1] + ${{ github.run_number }}
          if ($build -gt 65535) { throw "BUILD $build が 16 bit を超える" }
          if ($s -notmatch '(?m)^BUILD = BUILD_OSS\s*$') { throw "$f に BUILD = BUILD_OSS がない" }
          $s = $s -replace '(?m)^BUILD = BUILD_OSS\s*$', "BUILD = $build"
          [IO.File]::WriteAllText((Resolve-Path $f), $s)
          $out = New-TemporaryFile
          python mozc-src/src/build_tools/mozc_version.py --template_path $f --output $out --target_platform=Windows
          $got = (Select-String -Path $out -Pattern '^BUILD=(\d+)').Matches[0].Groups[1].Value
          Write-Host "版の BUILD: $got"
          if ($got -ne "$build") { throw "Mozc が読んだ BUILD($got)が書いた値($build)と違う" }
      # MSI に同梱するモデル(docs/adr/0012、パッチ 0003)。変換の手順が同じなら前に作ったものを使う。
      # medium は GPU のない PC の Low と Unreal で使う(docs/adr/0024)。
      - id: zenz
        uses: actions/cache@v4
        with:
          path: |
            kotori/target/kotori/zenz-v2.5-small-q8_0.gguf
            kotori/target/kotori/zenz-v2.5-medium-q8_0.gguf
          key: zenz-v2.5-small-medium-q8_0-${{ hashFiles('kotori/training/zenz/*') }}-${{ hashFiles('kotori/.gitmodules') }}
      - name: モデルを作る
        if: steps.zenz.outputs.cache-hit != 'true'
        shell: bash
        working-directory: kotori
        run: |
          git submodule update --init --depth 1 third_party/llama.cpp
          python -m pip install -q -r third_party/llama.cpp/requirements/requirements-convert_hf_to_gguf.txt
          mkdir -p target/kotori
          for size in small medium; do
            bash training/zenz/fetch.sh $size
            python training/zenz/convert.py training/zenz/models/zenz-v2.5-$size target/kotori/zenz-v2.5-$size-q8_0.gguf --outtype q8_0
          done
      # 同梱する LLM(docs/adr/0016)。f16 にしてから llama.cpp の公式ビルドの llama-quantize で Q5_K_M にする。
      - id: llm
        uses: actions/cache@v4
        with:
          path: kotori/target/kotori/tinyswallow-1.5b-q5_k_m.gguf
          key: llm-tinyswallow-1.5b-q5_k_m-${{ hashFiles('kotori/training/llm/*') }}
      - name: LLM を作る
        if: steps.llm.outputs.cache-hit != 'true'
        shell: bash
        working-directory: kotori
        run: |
          git submodule update --init --depth 1 third_party/llama.cpp
          python -m pip install -q -r third_party/llama.cpp/requirements/requirements-convert_hf_to_gguf.txt huggingface_hub
          curl -fsSL -o llama-bin.zip https://github.com/ggml-org/llama.cpp/releases/download/b11259/llama-b11259-bin-win-cpu-x64.zip
          mkdir -p llama-bin && unzip -q llama-bin.zip -d llama-bin
          PYTHON=python bash training/llm/make.sh "$PWD/llama-bin/llama-quantize.exe"
      - name: モデルを置く
        shell: pwsh
        run: |
          Copy-Item kotori/target/kotori/zenz-v2.5-small-q8_0.gguf mozc-src/src/data/kotori/
          Copy-Item kotori/target/kotori/zenz-v2.5-medium-q8_0.gguf mozc-src/src/data/kotori/
          Copy-Item kotori/target/kotori/tinyswallow-1.5b-q5_k_m.gguf mozc-src/src/data/kotori/
      - uses: actions/cache@v4
        with:
          path: mozc-src/src/third_party_cache
          key: mozc-update_deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('mozc-src/src/build_tools/update_deps.py') }}
      - name: 依存を取得する
        shell: cmd
        working-directory: .\mozc-src\src
        run: python build_tools/update_deps.py
      # Qt のビルドは約 25 分かかる。Mozc のコミットと手順が同じなら、前に作ったものを使う。
      - id: qt
        uses: actions/cache@v4
        with:
          path: mozc-src/src/third_party/qt
          key: mozc-qt-${{ runner.os }}-${{ env.MOZC_COMMIT }}-${{ hashFiles('mozc-src/src/build_tools/build_qt.py', 'mozc-src/src/build_tools/update_deps.py') }}
      - name: Qt を作る
        if: steps.qt.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: .\mozc-src\src
        run: python build_tools/build_qt.py --release --confirm_license
      # GitHub Actions はディスクが少ないので、Qt のソースを消す(公式の CI と同じ)。
      - name: Qt のソースを消す
        shell: cmd
        working-directory: .\mozc-src\src
        run: if exist third_party\qt_src rmdir third_party\qt_src /s /q
      # Bazel の結果を使い回し、パッチを変えたときは変わったところだけ作り直す。
      # 読むときは同じ Mozc のコミットの最新のものを使う。保存は main でだけ行う(1 回 2.7 GB あり、
      # PR ごとに保存するとキャッシュの上限 10 GB を超えて Qt や main のキャッシュが消え、ビルドが 90 分近くになる)。
      - uses: actions/cache/restore@v4
        with:
          path: D:\bazel-disk-cache
          key: mozc-bazel-${{ runner.os }}-${{ env.MOZC_COMMIT }}-${{ github.run_id }}
          restore-keys: |
            mozc-bazel-${{ runner.os }}-${{ env.MOZC_COMMIT }}-
      - name: ビルドする
        shell: cmd
        working-directory: .\mozc-src\src
        env:
          ANDROID_NDK_HOME: ""
        run: bazelisk build package --config release_build --disk_cache=D:\bazel-disk-cache
      # Kotori の変更の単体テスト(モデルなしで動くもの。docs/IMPROVEMENT_PROPOSALS.md の案 02)。
      - name: テストする
        shell: cmd
        working-directory: .\mozc-src\src
        env:
          ANDROID_NDK_HOME: ""
        run: bazelisk test //rewriter:lm_rewriter_test //base:kotori_diagnostics_test --config release_build --disk_cache=D:\bazel-disk-cache
      - if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@v4
        with:
          path: D:\bazel-disk-cache
          key: mozc-bazel-${{ runner.os }}-${{ env.MOZC_COMMIT }}-${{ github.run_id }}
      # パッチで名前を Kotori にしたので、ファイル名も合わせる(docs/adr/0012 の段階 2)。
      - name: インストーラの名前を変える
        shell: pwsh
        run: Copy-Item mozc-src/src/bazel-bin/win32/installer/Mozc64.msi Kotori64.msi
      - uses: actions/upload-artifact@v4
        with:
          name: Kotori64.msi
          path: Kotori64.msi
          if-no-files-found: error
      - name: 版とリリースの名前を決める
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        working-directory: kotori
        run: |
          $now = [TimeZoneInfo]::ConvertTimeBySystemTimeZoneId([DateTime]::UtcNow, 'Tokyo Standard Time')
          $stamp = $now.ToString('yyyy.Mdd.HHmmss', [Globalization.CultureInfo]::InvariantCulture)
          $hash = (Get-FileHash ../Kotori64.msi -Algorithm SHA256).Hash.ToLower()
          Set-Content -Encoding ascii ../Kotori64.msi.sha256 "$hash  Kotori64.msi"
          Write-Host "版 $env:TAG、名前 $stamp ($env:TAG)"
          "RELEASE_NAME=$stamp ($env:TAG)" >> $env:GITHUB_ENV
      - if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ env.PRERELEASE == 'true' }}
          make_latest: ${{ env.MAKE_LATEST }}
          body_path: kotori/mozc/release-notes.md
          files: |
            Kotori64.msi
            Kotori64.msi.sha256
